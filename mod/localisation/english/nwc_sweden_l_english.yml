l_english:
 nwc_propose_swe_trade:0 "Propose the Swedish Trade Agreement"
 nwc_propose_swe_trade_desc:0 "Put a trade agreement with Sweden before the Storting."
 nwc_propose_swe_border:0 "Propose the Border Cooperation Act"
 nwc_propose_swe_border_desc:0 "Put joint border control with Sweden before the Storting."
 nwc_propose_swe_defence:0 "Propose the Nordic Defence Pact"
 nwc_propose_swe_defence_desc:0 "Put closer defence ties with Sweden before the Storting."
 nwc_swe_advisor_1:0 "Swedish Economic Adviser"
 nwc_swe_advisor_2:0 "Swedish Political Adviser"
 nwc_swe_advisor_3:0 "Swedish Military Adviser"
 nwc_sweden.1.t:0 "Sweden Sends Aid"
 nwc_sweden.1.d:0 "Stockholm has begun sending equipment to the Government."
 nwc_sweden.1.a:0 "Welcome."
 nwc_sweden.2.t:0 "Sweden Intervenes"
 nwc_sweden.2.d:0 "Sweden has entered the war on the side of the Government."
 nwc_sweden.2.a:0 "Together."
 nwc_sweden.3.t:0 "A Warning from Stockholm"
 nwc_sweden.3.d:0 "Sweden has warned the Government that its patience is running out."
 nwc_sweden.3.a:0 "Noted."
 nwc_sweden.4.t:0 "Sweden Takes Control"
 nwc_sweden.4.d:0 "Swedish forces have stepped in and placed Norway under Swedish rule."
 nwc_sweden.4.a:0 "It is over."
 nwc_sweden.5.t:0 "A Swedish Candidate"
 nwc_sweden.5.d:0 "Stockholm has offered a Swedish-sponsored official to serve the Government."
 nwc_sweden.5.a:0 "Accept."
 nwc_sweden.5.b:0 "Refuse."
 nwc_sweden.6.t:0 "Sweden Opposes the Danish Union"
 nwc_sweden.6.d:0 "Sweden has declared war over Norway's union with Denmark."
 nwc_sweden.6.a:0 "To arms."
 nwc_news.20.t:0 "Norway Falls Under Swedish Rule"
 nwc_news.20.d:0 "Sweden has made Norway its puppet."
 nwc_news.20.a:0 "So it ends."
