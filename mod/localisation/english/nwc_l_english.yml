l_english:
 nwc_ana_guerrilla:0 "Legacy of Makhno"
 nwc_ana_guerrilla_desc:0 "Scattered, hidden and hard to root out."
 nwc_fortress_oslo:0 "Fortress Oslo"
 nwc_fortress_oslo_desc:0 "Oslo's bunkers, stores and fanatical defenders. Strength §Y[?nwc_fortress|0]%§!. Each step of the siege wears it down, but it never falls below 25%."
 nwc_fortress_small_tt:0 "§YFortress Oslo§! is weakened by §Y5–10%§!."
 nwc_fortress_large_tt:0 "§YFortress Oslo§! is weakened by §R10–20%§!."
 nwc_siege_deadline_tt:0 "We have §Y60 days§! to take Oslo, or the government falls."
 nwc_siege.1.t:0 "The Siege of Oslo"
 nwc_siege.1.d:0 "JNP holds Oslo behind Fortress Oslo. We must weaken it before we can storm the city. §YFortress Oslo§! currently stands at §Y[?JNP.nwc_fortress|0]%§! (floor 25%)."
 nwc_siege.1.a:0 "Cut the supply lines"
 nwc_siege.1.b:0 "Order airstrikes"
 nwc_siege.1.c:0 "Run a propaganda campaign"
 nwc_siege.2.t:0 "Tightening the Ring"
 nwc_siege.2.d:0 "The siege continues. §YFortress Oslo§! currently stands at §Y[?JNP.nwc_fortress|0]%§! (floor 25%)."
 nwc_siege.2.a:0 "Bombard the outer defences"
 nwc_siege.2.b:0 "Recruit informants inside the city"
 nwc_siege.2.c:0 "Open negotiations as a ruse"
 nwc_siege.3.t:0 "Starving the Fortress"
 nwc_siege.3.d:0 "Oslo's stores are running low. §YFortress Oslo§! currently stands at §Y[?JNP.nwc_fortress|0]%§! (floor 25%)."
 nwc_siege.3.a:0 "Hold the blockade"
 nwc_siege.3.b:0 "Launch probing assaults"
 nwc_siege.4.t:0 "The Last Preparations"
 nwc_siege.4.d:0 "The fortress is as weak as it will get. §YFortress Oslo§! currently stands at §Y[?JNP.nwc_fortress|0]%§! (floor 25%)."
 nwc_siege.4.a:0 "Massive artillery barrage"
 nwc_siege.4.b:0 "Offer amnesty to defectors"
 nwc_siege.5.t:0 "Storm Oslo Now"
 nwc_siege.5.d:0 "We have two months to take Oslo. If the city still stands, the government will not survive. §YFortress Oslo§! currently stands at §Y[?JNP.nwc_fortress|0]%§! (floor 25%)."
 nwc_siege.5.a:0 "Attack!"
 nwc_siege.7.t:0 "Oslo Has Fallen"
 nwc_siege.7.d:0 "Our troops hold Oslo. What do we do with the JNP fighters and their leaders?"
 nwc_siege.7.a:0 "Kill them all"
 nwc_siege.7.b:0 "Spare them"
 nwc_siege.10.t:0 "Støre Resigns"
 nwc_siege.10.d:0 "Jonas Gahr Støre steps down as Prime Minister."
 nwc_siege.10.a:0 "A new leader takes over"
 nwc_news.1.t:0 "The Genocide in Oslo"
 nwc_news.1.d:0 "Government forces have massacred the JNP defenders of Oslo. Norway descends into war."
 nwc_news.1.a:0 "Horrifying."
 nwc_news.2.t:0 "Stortinget Refuses Diplomacy"
 nwc_news.2.d:0 "Oslo has been taken and the JNP spared, but Stortinget refuses to negotiate with any other faction. War spreads across Norway."
 nwc_news.2.a:0 "So it begins."
 nwc_news.3.t:0 "Jonas Gahr Støre Assassinated"
 nwc_news.3.d:0 "With Oslo still in JNP hands, Prime Minister Jonas Gahr Støre has been assassinated."
 nwc_news.3.a:0 "Chaos."
 nwc_news.4.t:0 "The Great Norwegian War"
 nwc_news.4.d:0 "Every faction in Norway now takes up arms."
 nwc_news.4.a:0 "War."
 nwc_civilian_boom:0 "Civilian Boom"
 nwc_civilian_boom_desc:0 "Kept out of the fighting, our economy grows."
