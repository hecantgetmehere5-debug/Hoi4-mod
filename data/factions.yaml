# Every country on the map. colour is RGB; ideology is a placeholder until the
# ideology project replaces it. capital is a state key from states.yaml.
NOR: {name: Government of Norway, adjective: Norwegian, colour: [31, 63, 214], ideology: democratic, capital: baerum_asker}
WFR: {name: Western Forces, adjective: Western, colour: [74, 99, 201], ideology: democratic, capital: voss}
JNP: {name: Jihadist Nationalist Party, adjective: Jihadist, colour: [43, 43, 43], ideology: neutrality, capital: oslo}
KRF: {name: Christian Democratic Norway, adjective: Christian Democratic, colour: [240, 140, 0], ideology: democratic, capital: kristiansand}
SOC: {name: Socialist Norway, adjective: Socialist, colour: [214, 31, 31], ideology: communism, capital: stavanger}
FRP: {name: Free Norway, adjective: Libertarian, colour: [47, 155, 240], ideology: democratic, capital: trondheim}
NRM: {name: Nordic Resistance Movement, adjective: Nordic, colour: [122, 74, 18], ideology: fascism, capital: alesund}
SAP: {name: Sápmi, adjective: Sámi, colour: [148, 102, 214], ideology: democratic, capital: tromso}
NCL: {name: Neutral Coalition, adjective: Coalition, colour: [46, 125, 31], ideology: neutrality, capital: hamar}
ABI: {name: Askøy-Bømlo Insurgency, adjective: Insurgent, colour: [139, 15, 26], ideology: neutrality, capital: askoy}
BRG: {name: Free City of Bergen, adjective: Bergenser, colour: [212, 178, 10], ideology: neutrality, capital: bergen}
ANA: {name: Anarchist Cells, adjective: Anarchist, colour: [20, 8, 8], ideology: neutrality, capital: sel}
SWE: {name: Sweden, adjective: Swedish, colour: [176, 160, 116], ideology: democratic, capital: ostersund}

# Spawnable countries: own no states at start, released by events.
RDN: {name: Reindeer Nation, adjective: Reindeer, colour: [160, 120, 70], ideology: neutrality, capital: voss, spawn: true}
GMO: {name: Great Muslim Oslo Republic, adjective: Oslo, colour: [20, 110, 60], ideology: neutrality, capital: oslo, spawn: true}
# Neutral Coalition cantons reuse vanilla tags; cantons lists the NCL states each receives (first is the capital).
EST: {name: Hedmarken Canton, adjective: Hedmark, colour: [70, 150, 60], ideology: neutrality, capital: hamar, spawn: true, cantons: [hamar, ringsaker]}
LAT: {name: Gudbrandsdal Canton, adjective: Gudbrandsdal, colour: [90, 165, 80], ideology: neutrality, capital: lillehammer, spawn: true, cantons: [lillehammer, midt_gudbrandsdal, nord_gudbrandsdal]}
LIT: {name: Valdres Canton, adjective: Valdres, colour: [55, 135, 95], ideology: neutrality, capital: valdres, spawn: true, cantons: [valdres]}
ICE: {name: Østerdal Canton, adjective: Østerdal, colour: [35, 110, 45], ideology: neutrality, capital: sor_osterdal, spawn: true, cantons: [sor_osterdal, nord_osterdal, trysil]}
SCO: {name: Hadeland Canton, adjective: Hadeland, colour: [110, 175, 60], ideology: neutrality, capital: land, spawn: true, cantons: [land]}

# Background countries: own only the impassable land at the map edge.
FIN: {name: Finland, adjective: Finnish, colour: [200, 205, 215], ideology: democratic, capital: waste_fin, background: true}
SOV: {name: Russia, adjective: Russian, colour: [170, 120, 120], ideology: neutrality, capital: waste_sov, background: true}
DEN: {name: Denmark, adjective: Danish, colour: [180, 90, 90], ideology: democratic, capital: waste_den, background: true}
